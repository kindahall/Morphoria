    reference_image: references/visual_cards/07_interface_hud_roue_des_formes.png
    output_image: generated_assets/images/ui/hud_form_wheel.png
    prompt: >
      Morphoria game HUD and form wheel, dark blue panels with bright colored
      accents, four-form radial selector with Rokko Luma Papyra Cizo, golden
      stars, prism stars, hearts, checkpoint feedback, polished family 3D
