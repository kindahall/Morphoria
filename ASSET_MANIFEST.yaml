characters:
  - id: rokko
    display_name: Rokko
    form: pierre
    type: character_3d
    reference_image: references/concept_cards/file_000000001f987246ac460fb1633689ad.png
    output_glb: generated_assets/models_3d/characters/rokko.glb
    output_image: generated_assets/images/characters/rokko_concept.png
    prompt: >
      Rokko, small heroic rock guardian for Morphoria, premium cartoon 3D
      platformer style, bulky stone body, green scarf, amber glowing cracks,
      expressive golden eyes, readable heavy silhouette, game-ready character.

  - id: luma
    display_name: Luma
    form: feuille
    type: character_3d
    reference_image: references/concept_cards/file_000000003694724392741983104f6b3c.png
    output_glb: generated_assets/models_3d/characters/luma.glb
    output_image: generated_assets/images/characters/luma_concept.png
    prompt: >
      Luma, small leaf guardian for Morphoria, cute heroic 3D platformer
      character, green and yellow palette, leaf wings, orange scarf, expressive
      eyes, agile pose, premium cartoon game-ready model.

  - id: papyra
    display_name: Papyra
    form: papier
    type: character_3d
    reference_image: references/concept_cards/file_000000004de871f49f852df18f3af855.png
    output_glb: generated_assets/models_3d/characters/papyra.glb
    output_image: generated_assets/images/characters/papyra_concept.png
    prompt: >
      Papyra, small origami paper guardian for Morphoria, ivory and violet
      folded paper armor, magical runes, elegant folded silhouette, expressive
      face, premium cartoon 3D platformer style.

  - id: cizo
    display_name: Cizo
    form: ciseaux
    type: character_3d
    reference_image: references/concept_cards/file_00000000604c7243a407b82dedcc6dc2.png
    output_glb: generated_assets/models_3d/characters/cizo.glb
    output_image: generated_assets/images/characters/cizo_concept.png
    prompt: >
      Cizo, small scissors guardian for Morphoria, silver and blue armor,
      blade arms, fast heroic pose, orange spark accents, expressive eyes,
      premium cartoon 3D platformer game-ready character.

villain:
